<!DOCTYPE html>
<!--/* Chrome and palette live in _layout.html. The fragment reference must keep the .html
       extension: MailConfig selects resolvers by pattern with an empty suffix. */-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{mail/_layout.html :: page(~{::title}, ~{::heading}, ~{::body-copy}, 'See the results', ~{::footer})}">
<head>
  <title th:text="${challengeTitle}">Cook-off</title>
</head>
<body>
<th:block th:ref="heading">Hi <span th:text="${firstName}">there</span>, the results are in!</th:block>
<th:block th:ref="body-copy">
  <strong th:text="${challengeTitle}">The cook-off</strong> has been revealed.
  You can now see who cooked which plate, the scores per category, and the winner.
</th:block>
<th:block th:ref="footer">
  This link is personal to you and logs you in — please don't forward it.
  It works for 30 days.
</th:block>
</body>
</html>
