<!DOCTYPE html>
<!--/* Chrome and palette live in _layout.html. The fragment reference must keep the .html
       extension: MailConfig selects resolvers by pattern with an empty suffix. Wording lives in
       mail/messages*.properties; only HTML-escaped arguments go into the *.html messages. */-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{mail/_layout.html :: page(~{::title}, ~{::heading}, ~{::body-copy}, #{mail.passwordReset.cta}, ~{::footer})}">
<head>
  <title th:text="#{mail.passwordReset.title}">Reset your password</title>
</head>
<body>
<th:block th:ref="heading" th:text="#{mail.passwordReset.heading(${firstName})}">Hi there, let's reset your password</th:block>
<th:block th:ref="body-copy" th:text="#{mail.passwordReset.body}">An administrator started a password reset.</th:block>
<th:block th:ref="footer" th:text="#{mail.passwordReset.footer}">This link works once and expires in 2 hours.</th:block>
</body>
</html>
