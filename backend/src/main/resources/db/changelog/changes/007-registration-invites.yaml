databaseChangeLog:
  - changeSet:
      id: 007-01-create-registration-invites
      author: fraihs
      comment: >-
        Self-registration via organizer-generated QR (frontend-prd.md's self-registration
        flow). Same shape as access_links — a high-entropy token tied to one challenge — but
        issued by the organizer rather than per-participant, and consumed by an
        unauthenticated walk-in who doesn't have an account yet.
      changes:
        - createTable:
            tableName: registration_invites
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: issued_by_account_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: challenge_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: token
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: registration_invites
            baseColumnNames: issued_by_account_id
            referencedTableName: accounts
            referencedColumnNames: id
            constraintName: fk_registration_invites_issued_by
        - addForeignKeyConstraint:
            baseTableName: registration_invites
            baseColumnNames: challenge_id
            referencedTableName: challenges
            referencedColumnNames: id
            constraintName: fk_registration_invites_challenge
            onDelete: CASCADE
