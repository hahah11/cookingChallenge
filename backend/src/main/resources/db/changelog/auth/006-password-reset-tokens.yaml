databaseChangeLog:
  - changeSet:
      id: 006-01-create-password-reset-tokens
      author: fraihs
      comment: >-
        Admin-initiated password reset (plans/admin-password-reset-plan.md). Same shape as
        access_links minus challenge_id, but strictly single-use: used_at is claimed by one
        conditional UPDATE, so two concurrent redeems of the same token cannot both succeed.
      changes:
        - createTable:
            tableName: password_reset_tokens
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: account_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: token
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: used_at
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: password_reset_tokens
            baseColumnNames: account_id
            referencedTableName: accounts
            referencedColumnNames: id
            constraintName: fk_password_reset_tokens_account
            onDelete: CASCADE
