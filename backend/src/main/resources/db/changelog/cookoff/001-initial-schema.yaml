databaseChangeLog:
  - changeSet:
      id: 001-01-create-challenges
      author: fraihs
      changes:
        - createTable:
            tableName: challenges
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
              - column:
                  name: challenge_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: dish_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: cook_a_account_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: cook_b_account_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: created_by_account_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: challenges
            baseColumnNames: cook_a_account_id
            referencedTableName: accounts
            referencedColumnNames: id
            constraintName: fk_challenges_cook_a
        - addForeignKeyConstraint:
            baseTableName: challenges
            baseColumnNames: cook_b_account_id
            referencedTableName: accounts
            referencedColumnNames: id
            constraintName: fk_challenges_cook_b
        - addForeignKeyConstraint:
            baseTableName: challenges
            baseColumnNames: created_by_account_id
            referencedTableName: accounts
            referencedColumnNames: id
            constraintName: fk_challenges_created_by
        - sql:
            sql: >-
              ALTER TABLE challenges
              ADD CONSTRAINT chk_challenges_distinct_cooks
              CHECK (cook_a_account_id <> cook_b_account_id)
        - addForeignKeyConstraint:
            baseTableName: access_links
            baseColumnNames: challenge_id
            referencedTableName: challenges
            referencedColumnNames: id
            constraintName: fk_access_links_challenge
            onDelete: CASCADE

  - changeSet:
      id: 001-02-create-challenge-guests
      author: fraihs
      changes:
        - createTable:
            tableName: challenge_guests
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: challenge_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: guest_account_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: challenge_guests
            baseColumnNames: challenge_id
            referencedTableName: challenges
            referencedColumnNames: id
            constraintName: fk_challenge_guests_challenge
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: challenge_guests
            baseColumnNames: guest_account_id
            referencedTableName: accounts
            referencedColumnNames: id
            constraintName: fk_challenge_guests_account
        - addUniqueConstraint:
            tableName: challenge_guests
            columnNames: challenge_id, guest_account_id
            constraintName: uq_challenge_guests_challenge_account

  - changeSet:
      id: 001-03-create-score-submissions
      author: fraihs
      changes:
        - createTable:
            tableName: score_submissions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: challenge_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: guest_account_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: submitted_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: score_submissions
            baseColumnNames: challenge_id
            referencedTableName: challenges
            referencedColumnNames: id
            constraintName: fk_score_submissions_challenge
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: score_submissions
            baseColumnNames: guest_account_id
            referencedTableName: accounts
            referencedColumnNames: id
            constraintName: fk_score_submissions_account
        - addUniqueConstraint:
            tableName: score_submissions
            columnNames: challenge_id, guest_account_id
            constraintName: uq_score_submissions_challenge_account

  - changeSet:
      id: 001-04-create-scores
      author: fraihs
      changes:
        - createTable:
            tableName: scores
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: submission_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: dish_label
                  type: VARCHAR(1)
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: points
                  type: INT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: scores
            baseColumnNames: submission_id
            referencedTableName: score_submissions
            referencedColumnNames: id
            constraintName: fk_scores_submission
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: scores
            columnNames: submission_id, dish_label, category
            constraintName: uq_scores_submission_label_category
        - sql:
            sql: >-
              ALTER TABLE scores
              ADD CONSTRAINT chk_scores_dish_label CHECK (dish_label IN ('A', 'B'))
        - sql:
            sql: >-
              ALTER TABLE scores
              ADD CONSTRAINT chk_scores_points_range CHECK (points BETWEEN 0 AND 5)

  - changeSet:
      id: 001-05-create-cook-rivalries
      author: fraihs
      changes:
        - createTable:
            tableName: cook_rivalries
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: cook_a_account_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: cook_b_account_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: cook_a_wins
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: cook_b_wins
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: draws
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: total_challenges
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: cook_rivalries
            baseColumnNames: cook_a_account_id
            referencedTableName: accounts
            referencedColumnNames: id
            constraintName: fk_cook_rivalries_cook_a
        - addForeignKeyConstraint:
            baseTableName: cook_rivalries
            baseColumnNames: cook_b_account_id
            referencedTableName: accounts
            referencedColumnNames: id
            constraintName: fk_cook_rivalries_cook_b
        - addUniqueConstraint:
            tableName: cook_rivalries
            columnNames: cook_a_account_id, cook_b_account_id
            constraintName: uq_cook_rivalries_pair
        - sql:
            sql: >-
              ALTER TABLE cook_rivalries
              ADD CONSTRAINT chk_cook_rivalries_ordered_pair
              CHECK (cook_a_account_id < cook_b_account_id)
