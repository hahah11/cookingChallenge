# Mail wording, English (default and fallback). Read by MailMessages as a MessageFormat pattern:
# a literal apostrophe is written '' and {0}, {1} are arguments.
# messages_de.properties must define exactly the same keys (MailMessagesTest enforces it).
# *.html keys may contain markup and receive HTML-escaped arguments; *.text keys are plain text.

mail.layout.linkFallback=If the button doesn''t work, copy this into your browser:

# Shared by access-link and results-available. "30 days" mirrors LINK_VALIDITY in
# SendChallengeInvitationsService / ChallengeRevealedNotifier.
mail.personalLink.footer=This link is personal to you and logs you in — please don''t forward it. It works for 30 days.

mail.accessLink.subject=You''re invited: {0}
mail.accessLink.heading=Hi {0}, you''re invited!
mail.accessLink.intro.html=You''re taking part in <strong>{0}</strong>.
mail.accessLink.intro.text=You''re taking part in "{0}".
mail.accessLink.canRate=Scoring is open — taste each plate and rate it on all three categories.
mail.accessLink.picksPlateColor=You''re cooking in this one. Open the cook-off to choose your plate color — the guests will score the dishes blind.
mail.accessLink.cta=Open the cook-off

mail.resultsAvailable.subject=The results are in: {0}
mail.resultsAvailable.heading=Hi {0}, the results are in!
mail.resultsAvailable.intro.html=<strong>{0}</strong> has been revealed.
mail.resultsAvailable.intro.text="{0}" has been revealed.
mail.resultsAvailable.canRate=You can now see who cooked which plate, the scores per category, and the winner.
mail.resultsAvailable.picksPlateColor=The dishes are unblinded. See how yours scored in each category, and who took it.
mail.resultsAvailable.cta=See the results

# "2 hours" mirrors TOKEN_VALIDITY in PasswordResetService.
mail.passwordReset.subject=Reset your CookOff password
mail.passwordReset.title=Reset your password
mail.passwordReset.heading=Hi {0}, let''s reset your password
mail.passwordReset.body=An administrator started a password reset for your CookOff account. Choose a new password to log in again.
mail.passwordReset.footer=This link works once and expires in 2 hours. If you weren''t expecting it, you can ignore this mail — your current password keeps working until a new one is set.
mail.passwordReset.cta=Set a new password
