# Single public entrypoint for the whole stack: serves the Angular build and proxies /api to
# the backend container, so the browser only ever talks to one origin. That is what lets
# frontend/src/app/core/api/api-config.ts keep provideApi('') — no CORS, no per-deployment
# API base URL baked into the bundle.

upstream backend {
    server backend:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular's build budget keeps the initial bundle under 1 MB, but gzip still roughly
    # thirds it over a LAN.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json font/woff2;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # outputHashing: "all" — every asset filename changes when its content does.
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA deep links (/challenges/:id, access-link routes) must reach index.html, not 404.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
