<h2 mat-dialog-title>Send links</h2>
<mat-dialog-content class="send-links-dialog__content">
  @switch (state()) {
    @case ('loading') {
      <app-loading-skeleton [lines]="4" />
    }
    @case ('error') {
      <app-error-state [message]="errorMessage()" [retryable]="true" (retry)="load()" />
    }
    @case ('loaded') {
      <p class="send-links-dialog__hint">Choose who should get (or be resent) an access link.</p>
      @for (guest of guests(); track guest.accountId) {
        <mat-checkbox
          [checked]="selectedIds().has(guest.accountId)"
          (change)="toggle(guest.accountId, $event.checked)"
        >
          {{ guest.name }}
          @if (guest.submitted) {
            <span class="send-links-dialog__submitted">already submitted</span>
          }
        </mat-checkbox>
      }
    }
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="onCancel()">Cancel</button>
  <button
    mat-flat-button
    type="button"
    [disabled]="state() !== 'loaded' || selectedIds().size === 0 || submitting()"
    (click)="onSend()"
  >
    @if (submitting()) {
      <mat-spinner diameter="20" />
    } @else {
      Send links
    }
  </button>
</mat-dialog-actions>
