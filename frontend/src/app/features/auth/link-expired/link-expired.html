<mat-card appearance="raised" class="link-expired__card">
  <mat-card-content class="link-expired__content">
    <mat-icon class="link-expired__icon" aria-hidden="true">link_off</mat-icon>
    <p class="link-expired__kicker">{{ copyKey() + '.kicker' | transloco }}</p>
    <h1 class="link-expired__headline">{{ copyKey() + '.headline' | transloco }}</h1>
    <p class="link-expired__body">{{ copyKey() + '.body' | transloco }}</p>
    <a mat-stroked-button routerLink="/login" class="link-expired__action">{{ 'linkExpired.back' | transloco }}</a>
  </mat-card-content>
</mat-card>
