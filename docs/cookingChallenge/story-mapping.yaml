    label: Questions
  - color: "#fecdd3"
    label: Edge cases
slices:
  - name: V1
    stories:
      Select CookOff:
        - name: Choose open Cookoff on Guest Home page
          body: Only those where he is invited to are visible
        - name: Correct selection if wrongly clicked
      Rate Plates:
        - name: Rate dishes from 1 to 5
          body: |-
            There are 3 Categories
            - Mundgefühl
            - Tellersprache
            - Geschmack

            In each Category for each cook, you can give 1 to 5 stars
        - name: Edit already submitted scores
          body: Allowed as long as the Cookoff has not been revealed yet
      Confirm Submission:
        - name: Ask Guest if he is really sure about his ranking
        - name: Show thank you page
        - name: Get back to home screen
        - name: "[Edge case] Block resubmission if guest already voted for this Cookoff"
          color: "#fecdd3"
      Show Results:[0] Select REVEALED CookOff:
        - name: Choose REVEALED CookOff on Guest Home page
          body: only ones the guest took part of
        - name: Correct selection if wrongly clicked
      "Show Results:[0] Show Results: Look at Results":
        - name: Show winner and scores per category
        - name: Show names of cooks
        - name: Show plate colors
        - name: Show points of cook rivalries
        - name: Get Back to guests home page
      Select Open CookOff:
        - name: Choose Open Cookoff where Cook is assigned
        - name: Correct wrongly click selection
      View Available Plate Colors:
        - name: Show available Plate colors
      Assign Plate Color:
        - name: Ask if he is really sure to choose plate color
        - name: ""
        - name: "[Edge case] Prevent choosing a color already taken by the other cook"
          color: "#fecdd3"
      Show Results:[1] Select REVEALED CookOff:
        - name: Show only REVEALED cookoffs where he took part
        - name: Correct selection if wrongly clicked
      "Show Results:[1] Show Results: Look at Results":
        - name: Show winner and scores per category
        - name: Show names of cooks
        - name: Show plate colors
        - name: Show points of cook rivalries
        - name: Get Back to guests home page
      View Voting Status:
        - name: See who already submitted and who didn't submit yet
      Reveal Cookoff:
        - name: Ask organizer to confirm before revealing results
        - name: Set Cookoff status to revealed
        - name: Notify guests and cooks that results are available
        - name: "[Edge case] Warn organizer if not all guests have submitted votes yet"
          color: "#fecdd3"
      Edit Guests:
        - name: Add guests
        - name: Remove guests
      Edit Cooks:
        - name: Add cook
        - name: Remove cook
      Invite Participants:
        - name: Generate registration QR code
        - name: Send email invite links to guests and cooks
        - name: "[Edge case] Show error if QR code or invite link has expired"
          color: "#fecdd3"
      Enter Cookoff Details:
        - name: Choose a picture
        - name: Enter a title
        - name: Enter a dish name
      Assign Cooks:
        - name: Choose the 2 cooks
      Assign Guests:
        - name: Choose the guests
      Confirm Creation:
        - name: Save the Cookoff
      Show Results:[2] Select REVEALED CookOff:
        - name: Choose REVEALED CookOff organized by him
          body: only ones he organized
        - name: Correct selection if wrongly clicked
      "Show Results:[2] Show Results: Look at Results":
        - name: Show winner and scores per category
        - name: Show names of cooks
        - name: Show plate colors
        - name: Show points of cook rivalries
        - name: Get back to organizer home page
      "Unreveal Cookoff: Select REVEALED CookOff":
        - name: Choose REVEALED CookOff organized by him
          body: only ones he organized
        - name: Correct selection if wrongly clicked
      Unreveal Cookoff:
        - name: Ask if he is really sure to unreveal the Cookoff
        - name: Set Cookoff status back to not revealed
      Show Rivalries:
        - name: List all cook rivalries with overall score
      Select Rivalry:
        - name: Choose a rivalry between two specific cooks
      View Rivalry History:
        - name: Show open Cookoffs between the two cooks
        - name: Show closed Cookoffs between the two cooks
      Add Account:
        - name: Enter first name
        - name: Enter last name
        - name: Enter mail address
        - name: Choose role (Admin, Organizer or User)
      Select Account:
        - name: Choose an account to edit
      Edit Account:
        - name: Change first name
        - name: Change last name
        - name: Change mail address
        - name: Change role (Admin, Organizer or User)
        - name: "[Question] Should admins be able to deactivate or delete an account?"
          color: "#bef264"
notes: |-
  Thanks for trying Storymaps.io! 

  If you find it useful, please consider starring the open-source repo: https://github.com/jackgleeson/storymaps.io

  Have a great day!
