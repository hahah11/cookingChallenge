openapi: 3.0.3
info:
  title: CookingChallenge API
  description: >
    API contract for the CookingChallenge organizer/guest cooking-challenge app.
    Shaped around the screens in the UI mockup (see
    docs/cookingChallenge/design-reference.md) rather than a 1:1 dump of the domain
    model: every computed value (submission progress, category winners, rivalry
    summaries) is pre-shaped by the server so the frontend only holds UI state.
  version: "1.0.0"
servers:
  - url: /
tags:
  - name: Auth
    description: Organizer/admin login.
  - name: Accounts
    description: Account administration (organizer/admin only).
  - name: Challenges
    description: Challenge lifecycle - create, view, reveal, score.
  - name: Rivalries
    description: Head-to-head cook rivalry records.
  - name: Home
    description: Guest-facing personalized home (link-token access, no login).

paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Organizer/admin login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: List accounts
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Paginated list of accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Create an account
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/accounts/{accountId}:
    patch:
      tags: [Accounts]
      operationId: updateAccount
      summary: Edit an account's name/roles
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AccountIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: Account updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/challenges:
    get:
      tags: [Challenges]
      operationId: listChallenges
      summary: Challenge history, with per-challenge submission progress embedded
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Paginated challenge history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Challenges]
      operationId: createChallenge
      summary: Create a new challenge
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChallengeRequest'
      responses:
        '201':
          description: Challenge created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/challenges/{challengeId}:
    get:
      tags: [Challenges]
      operationId: getChallenge
      summary: Get a challenge as seen by a participant (guest or cook), via access-link token
      description: >
        Cook-to-label mapping (`cookAssignments`) is omitted (null) until the
        challenge is REVEALED, so guests/cooks can't infer blind assignments early.
      security: [{ accessLinkToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ChallengeIdPathParam'
      responses:
        '200':
          description: Challenge detail for the requesting participant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantChallengeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/challenges/{challengeId}/status:
    get:
      tags: [Challenges]
      operationId: getChallengeStatus
      summary: Guest list with per-guest submission status, for the organizer detail screen
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChallengeIdPathParam'
      responses:
        '200':
          description: Submission status, one row per guest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/challenges/{challengeId}/participants:
    patch:
      tags: [Challenges]
      operationId: updateChallengeParticipants
      summary: Reassign cooks and/or add/remove guests (OPEN challenges only)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChallengeIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateParticipantsRequest'
      responses:
        '200':
          description: Participants updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Challenge is not OPEN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/challenges/{challengeId}/invitations:
    post:
      tags: [Challenges]
      operationId: sendInvitations
      summary: Send (or resend) guest access-link invitations
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChallengeIdPathParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendInvitationsRequest'
      responses:
        '200':
          description: Invitations sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationsSentResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/challenges/{challengeId}/reveal:
    post:
      tags: [Challenges]
      operationId: revealChallenge
      summary: Reveal cook identities and compute results
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChallengeIdPathParam'
      responses:
        '200':
          description: Challenge revealed; results computed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeResultResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Challenge is not OPEN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/challenges/{challengeId}/unreveal:
    post:
      tags: [Challenges]
      operationId: unrevealChallenge
      summary: Reverse a reveal, returning the challenge to OPEN
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChallengeIdPathParam'
      responses:
        '200':
          description: Challenge returned to OPEN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Challenge is not REVEALED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/challenges/{challengeId}/results:
    get:
      tags: [Challenges]
      operationId: getChallengeResults
      summary: Revealed results, category winners, and rivalry summary
      description: >
        Reachable by the organizer (bearer token) or a participant (access-link
        token) - same shape either way.
      security:
        - bearerAuth: []
        - accessLinkToken: []
      parameters:
        - $ref: '#/components/parameters/ChallengeIdPathParam'
      responses:
        '200':
          description: Challenge results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeResultResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Challenge has not been revealed yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/challenges/{challengeId}/scores:
    post:
      tags: [Challenges]
      operationId: submitScores
      summary: Submit (or edit, until reveal) blind category scores for both dishes
      description: >
        Scores are editable until the challenge is revealed: the first
        submission returns 201, a later resubmission by the same guest returns
        200 and replaces the prior scores. Once REVEALED, further submissions
        are rejected.
      security: [{ accessLinkToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ChallengeIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitScoresRequest'
      responses:
        '200':
          description: Prior submission updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreSubmissionResponse'
        '201':
          description: First submission recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreSubmissionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Challenge has already been revealed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/rivalries:
    get:
      tags: [Rivalries]
      operationId: listRivalries
      summary: List all cook rivalries
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Paginated rivalry list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RivalryListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/rivalries/{cookAAccountId}/{cookBAccountId}:
    get:
      tags: [Rivalries]
      operationId: getRivalryDetail
      summary: Head-to-head rivalry detail for a cook pair, plus their shared challenges
      description: The pair is order-independent - it is canonicalized server-side.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CookAAccountIdPathParam'
        - $ref: '#/components/parameters/CookBAccountIdPathParam'
      responses:
        '200':
          description: Rivalry detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RivalryDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/me/home:
    get:
      tags: [Home]
      operationId: getMyHome
      summary: Guest-facing personalized home - challenges needing action vs. already handled
      description: >
        `open` holds OPEN challenges the requester has not yet submitted scores
        for (needs action). `past` holds everything else the requester is a
        participant in: OPEN-but-already-submitted (still editable until
        reveal) and REVEALED challenges (view results).
      security: [{ accessLinkToken: [] }]
      responses:
        '200':
          description: The requester's home buckets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestHomeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Organizer/admin login token.
    accessLinkToken:
      type: apiKey
      in: query
      name: token
      description: >
        Per-guest access-link token issued via invitations; resolved to an
        AccountId by AccessLinkAuthenticationFilter. No login/password.

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ChallengeIdPathParam:
      name: challengeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Tsid'
    AccountIdPathParam:
      name: accountId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Tsid'
    CookAAccountIdPathParam:
      name: cookAAccountId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Tsid'
    CookBAccountIdPathParam:
      name: cookBAccountId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Tsid'

  responses:
    ValidationError:
      description: Request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid, or expired credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but not permitted to perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Request conflicts with current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Tsid:
      type: string
      description: Aggregate id, Crockford Base32-encoded TSID.
      example: "0K3X8Y4Z9QJ7M"

    ApiMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time

    Pagination:
      type: object
      required: [page, size, totalElements, totalPages, first, last]
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        first:
          type: boolean
        last:
          type: boolean

    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    ErrorBody:
      type: object
      required: [code, message, details, requestId, timestamp]
      properties:
        code:
          type: string
          example: NOT_FOUND
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'

    # --- Domain vocabulary ---

    ChallengeStatus:
      type: string
      enum: [OPEN, REVEALED]

    Category:
      type: string
      enum: [MUNDGEFUEHL, TELLERSPRACHE, GESCHMACK]

    DishLabel:
      type: string
      enum: [A, B]

    SystemRole:
      type: string
      enum: [ADMIN, ORGANIZER, USER]

    # --- Auth ---

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthToken:
      type: object
      required: [accessToken, expiresAt]
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time

    AuthTokenResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/AuthToken'
        meta:
          $ref: '#/components/schemas/ApiMeta'

    # --- Accounts ---

    Account:
      type: object
      required: [id, email, name, roles]
      properties:
        id:
          $ref: '#/components/schemas/Tsid'
        email:
          type: string
          format: email
        name:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/SystemRole'

    CreateAccountRequest:
      type: object
      required: [email, name]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/SystemRole'
          description: Defaults to [USER] if omitted.
        password:
          type: string
          nullable: true
          description: Required for ORGANIZER/ADMIN roles; ignored for USER-only accounts.

    UpdateAccountRequest:
      type: object
      properties:
        name:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/SystemRole'
          description: Replaces the account's full role set; must not end up empty.

    AccountResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Account'
        meta:
          $ref: '#/components/schemas/ApiMeta'

    AccountListResponse:
      type: object
      required: [data, pagination, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        pagination:
          $ref: '#/components/schemas/Pagination'
        meta:
          $ref: '#/components/schemas/ApiMeta'

    # --- Challenges (organizer-facing) ---

    CookAssignment:
      type: object
      required: [accountId, label]
      properties:
        accountId:
          $ref: '#/components/schemas/Tsid'
        label:
          $ref: '#/components/schemas/DishLabel'

    Challenge:
      type: object
      required:
        - id
        - date
        - title
        - dishName
        - status
        - cookAssignments
        - guestAccountIds
        - createdByAccountId
        - submittedGuestCount
        - totalGuestCount
      properties:
        id:
          $ref: '#/components/schemas/Tsid'
        date:
          type: string
          format: date
        title:
          type: string
        dishName:
          type: string
        status:
          $ref: '#/components/schemas/ChallengeStatus'
        cookAssignments:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/CookAssignment'
        guestAccountIds:
          type: array
          items:
            $ref: '#/components/schemas/Tsid'
        createdByAccountId:
          $ref: '#/components/schemas/Tsid'
        submittedGuestCount:
          type: integer
        totalGuestCount:
          type: integer

    CreateChallengeRequest:
      type: object
      required: [date, title, dishName, cookAAccountId, cookBAccountId]
      properties:
        date:
          type: string
          format: date
        title:
          type: string
        dishName:
          type: string
        cookAAccountId:
          $ref: '#/components/schemas/Tsid'
        cookBAccountId:
          $ref: '#/components/schemas/Tsid'
        guestAccountIds:
          type: array
          items:
            $ref: '#/components/schemas/Tsid'
          default: []

    UpdateParticipantsRequest:
      type: object
      description: Only OPEN challenges accept this. Every field is optional; omitted fields are left unchanged.
      properties:
        cookAAccountId:
          $ref: '#/components/schemas/Tsid'
        cookBAccountId:
          $ref: '#/components/schemas/Tsid'
        addGuestAccountIds:
          type: array
          items:
            $ref: '#/components/schemas/Tsid'
        removeGuestAccountIds:
          type: array
          items:
            $ref: '#/components/schemas/Tsid'

    ChallengeResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Challenge'
        meta:
          $ref: '#/components/schemas/ApiMeta'

    ChallengeListResponse:
      type: object
      required: [data, pagination, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Challenge'
        pagination:
          $ref: '#/components/schemas/Pagination'
        meta:
          $ref: '#/components/schemas/ApiMeta'

    SendInvitationsRequest:
      type: object
      properties:
        guestAccountIds:
          type: array
          items:
            $ref: '#/components/schemas/Tsid'
          description: >
            Guests to (re)send a link to. Omit to send to every guest who
            hasn't submitted yet.

    InvitationsSent:
      type: object
      required: [count]
      properties:
        count:
          type: integer

    InvitationsSentResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/InvitationsSent'
        meta:
          $ref: '#/components/schemas/ApiMeta'

    GuestSubmissionStatus:
      type: object
      required: [accountId, name, email, submitted]
      properties:
        accountId:
          $ref: '#/components/schemas/Tsid'
        name:
          type: string
        email:
          type: string
          format: email
        submitted:
          type: boolean
        submittedAt:
          type: string
          format: date-time
          nullable: true

    SubmissionStatus:
      type: object
      required: [challengeId, totalGuestCount, submittedGuestCount, guests]
      properties:
        challengeId:
          $ref: '#/components/schemas/Tsid'
        totalGuestCount:
          type: integer
        submittedGuestCount:
          type: integer
        guests:
          type: array
          items:
            $ref: '#/components/schemas/GuestSubmissionStatus'

    SubmissionStatusResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/SubmissionStatus'
        meta:
          $ref: '#/components/schemas/ApiMeta'

    RivalrySummary:
      type: object
      required: [cookAAccountId, cookBAccountId, cookAWins, cookBWins, draws, totalChallenges, headline]
      properties:
        cookAAccountId:
          $ref: '#/components/schemas/Tsid'
        cookBAccountId:
          $ref: '#/components/schemas/Tsid'
        cookAWins:
          type: integer
        cookBWins:
          type: integer
        draws:
          type: integer
        totalChallenges:
          type: integer
        headline:
          type: string
          description: Server-rendered display text, e.g. "Alice leads Bob 3-1 (1 draw)".

    ChallengeResult:
      type: object
      required: [challengeId, categoryWinners, overallWinnerAccountId, cookAssignments, rivalry]
      properties:
        challengeId:
          $ref: '#/components/schemas/Tsid'
        categoryWinners:
          type: object
          description: >
            Keyed by Category enum name; value is the winning cook's
            accountId, or null if that category was a draw.
          additionalProperties:
            $ref: '#/components/schemas/Tsid'
        overallWinnerAccountId:
          type: string
          nullable: true
          description: Aggregate id, Crockford Base32-encoded TSID. Null if the result was a draw.
        cookAssignments:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/CookAssignment'
        rivalry:
          $ref: '#/components/schemas/RivalrySummary'

    ChallengeResultResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/ChallengeResult'
        meta:
          $ref: '#/components/schemas/ApiMeta'

    # --- Challenges (participant-facing: guest or cook, via access-link) ---

    Score:
      type: object
      required: [dishLabel, category, points]
      properties:
        dishLabel:
          $ref: '#/components/schemas/DishLabel'
        category:
          $ref: '#/components/schemas/Category'
        points:
          type: integer
          minimum: 0
          maximum: 5

    MyScoreSubmission:
      type: object
      required: [scores, submittedAt]
      properties:
        scores:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: '#/components/schemas/Score'
        submittedAt:
          type: string
          format: date-time

    ParticipantChallenge:
      type: object
      required:
        - id
        - date
        - title
        - dishName
        - status
        - labels
        - categories
        - submitted
        - mySubmission
      properties:
        id:
          $ref: '#/components/schemas/Tsid'
        date:
          type: string
          format: date
        title:
          type: string
        dishName:
          type: string
        status:
          $ref: '#/components/schemas/ChallengeStatus'
        labels:
          type: array
          items:
            $ref: '#/components/schemas/DishLabel'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        cookAssignments:
          type: array
          nullable: true
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/CookAssignment'
          description: Null until the challenge is REVEALED.
        submitted:
          type: boolean
          description: Whether the requester has an existing score submission for this challenge.
        mySubmission:
          type: object
          nullable: true
          description: The requester's own prior submission, for edit-until-reveal pre-fill. Null if not yet submitted.
          allOf:
            - $ref: '#/components/schemas/MyScoreSubmission'

    ParticipantChallengeResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/ParticipantChallenge'
        meta:
          $ref: '#/components/schemas/ApiMeta'

    ScoreEntry:
      type: object
      required: [dishLabel, category, points]
      properties:
        dishLabel:
          $ref: '#/components/schemas/DishLabel'
        category:
          $ref: '#/components/schemas/Category'
        points:
          type: integer
          minimum: 0
          maximum: 5

    SubmitScoresRequest:
      type: object
      required: [scores]
      properties:
        scores:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: '#/components/schemas/ScoreEntry'
          description: Exactly one entry per (dishLabel, category) pair - 2 labels x 3 categories.

    ScoreSubmission:
      type: object
      required: [challengeId, guestAccountId, scores, submittedAt]
      properties:
        challengeId:
          $ref: '#/components/schemas/Tsid'
        guestAccountId:
          $ref: '#/components/schemas/Tsid'
        scores:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: '#/components/schemas/Score'
        submittedAt:
          type: string
          format: date-time

    ScoreSubmissionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/ScoreSubmission'
        meta:
          $ref: '#/components/schemas/ApiMeta'

    GuestHome:
      type: object
      required: [open, past]
      properties:
        open:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantChallenge'
        past:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantChallenge'

    GuestHomeResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/GuestHome'
        meta:
          $ref: '#/components/schemas/ApiMeta'

    # --- Rivalries ---

    Rivalry:
      type: object
      required: [cookAAccountId, cookAName, cookBAccountId, cookBName, cookAWins, cookBWins, draws, totalChallenges, headline]
      properties:
        cookAAccountId:
          $ref: '#/components/schemas/Tsid'
        cookAName:
          type: string
        cookBAccountId:
          $ref: '#/components/schemas/Tsid'
        cookBName:
          type: string
        cookAWins:
          type: integer
        cookBWins:
          type: integer
        draws:
          type: integer
        totalChallenges:
          type: integer
        headline:
          type: string
          description: Server-rendered display text, e.g. "Alice leads Bob 3-1 (1 draw)".

    RivalryListResponse:
      type: object
      required: [data, pagination, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Rivalry'
        pagination:
          $ref: '#/components/schemas/Pagination'
        meta:
          $ref: '#/components/schemas/ApiMeta'

    RivalryChallengeSummary:
      type: object
      required: [id, date, title, status, overallWinnerAccountId]
      properties:
        id:
          $ref: '#/components/schemas/Tsid'
        date:
          type: string
          format: date
        title:
          type: string
        status:
          $ref: '#/components/schemas/ChallengeStatus'
        overallWinnerAccountId:
          type: string
          nullable: true
          description: Aggregate id, Crockford Base32-encoded TSID. Null while OPEN, or if the revealed result was a draw.

    RivalryDetail:
      allOf:
        - $ref: '#/components/schemas/Rivalry'
        - type: object
          required: [challenges]
          properties:
            challenges:
              type: array
              items:
                $ref: '#/components/schemas/RivalryChallengeSummary'

    RivalryDetailResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/RivalryDetail'
        meta:
          $ref: '#/components/schemas/ApiMeta'

security:
  - bearerAuth: []
