name: Publish container images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Image version = BASE_VERSION.<workflow run number>, e.g. 0.1.42 — minted automatically on
  # every push to main, immutable once published. Bump BASE_VERSION by hand to start a new line
  # after something notable; run_number keeps counting straight through such a bump, so numbers
  # never repeat. Caveat: run_number is per workflow FILE and restarts at 1 if this file is
  # renamed, which would make versions appear to go backwards.
  BASE_VERSION: '0.1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            dockerfile: docker/backend.Dockerfile
          - component: frontend
            dockerfile: docker/frontend.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/cookingchallenge-${{ matrix.component }}
          tags: |
            type=raw,value=${{ env.BASE_VERSION }}.${{ github.run_number }}
            type=raw,value=latest
            type=sha,format=long

      # The server notebook is x86_64; both build stages run natively on the runner.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          # The backend reports this on GET /api/v1/config, which is how the running version
          # becomes visible in the UI. The frontend image declares the ARG but ignores it.
          build-args: |
            APP_VERSION=${{ env.BASE_VERSION }}.${{ github.run_number }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  # Records the published version in the repo: a VERSION file committed to main, plus a git tag
  # with the same name as the image tag, so `git checkout 0.1.42` gives the source of image 0.1.42.
  # Pushes made with GITHUB_TOKEN never trigger workflows, so this commit can't cause a rebuild loop.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two quick pushes to main would otherwise race to commit VERSION.
    concurrency:
      group: release-version
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Commit VERSION and tag
        env:
          VERSION: ${{ env.BASE_VERSION }}.${{ github.run_number }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "$VERSION" > VERSION
          git add VERSION
          git commit -m "Release $VERSION [skip ci]"
          # Tag the release commit so the tagged tree contains the matching VERSION file. It
          # differs from the built commit (${{ github.sha }}) only by that file.
          git tag -a "$VERSION" -m "Release $VERSION (built from ${{ github.sha }})"
          # main may have moved on since checkout; replay the VERSION commit on top and re-tag.
          pushed=false
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then pushed=true; break; fi
            git pull --rebase origin main
            git tag -f -a "$VERSION" -m "Release $VERSION (built from ${{ github.sha }})"
          done
          [ "$pushed" = true ] || { echo "Could not push VERSION to main"; exit 1; }
          git push origin "refs/tags/$VERSION"

  # GitHub's Free plan caps PRIVATE package storage (~500 MB), and every push leaves the
  # previous untagged manifest behind. Prune them so the quota doesn't fill up.
  prune:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Delete untagged versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: cookingchallenge-${{ matrix.component }}
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: true
